# Release: git tag v1.2.3 && git push origin v1.2.3
# Testa, gera o instalador MSI (Windows x64) e cria a GitHub Release com ele para download.
name: Release

on:
  push:
    tags: ["v*.*.*"]

# Mínimo para todos os jobs; os que publicam pedem mais no próprio bloco.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ScreenCord.sln

  release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x

      - name: Gerar o instalador
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet build installer/ScreenCord.Installer -c Release -p:AppVersion="$VERSION"
          mkdir -p dist
          cp installer/ScreenCord.Installer/bin/Release/ScreenCord-Setup.msi "dist/ScreenCord-Setup-$VERSION-x64.msi"

      # Assina o MSI com a chave privada do secret RELEASE_SIGNING_KEY (ECDSA P-256; só este repo privado a tem, o
      # PUBLIC_RELEASES_TOKEN não alcança). O app instalado só aceita o MSI cuja assinatura (arquivo .sig na release)
      # confere com a chave pública embutida em ReleaseSignature.cs. A mensagem assinada é a de ReleaseSignature.Message.
      # Se a chave do secret não for a embutida no código, a release para aqui: sairia um MSI que ninguém consegue instalar.
      - name: Assinar o instalador
        run: |
          msi=$(ls dist/*.msi)
          name=$(basename "$msi")
          sha=$(sha256sum "$msi" | cut -d' ' -f1)
          printf 'screencord-release-v1\n%s\n%s' "$name" "$sha" > "$RUNNER_TEMP/message.txt"
          printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
          pub=$(openssl ec -in "$RUNNER_TEMP/key.pem" -pubout -outform DER | base64 -w0)
          if ! grep -qF "$pub" src/ScreenCord/Security/ReleaseSignature.cs; then
            echo "::error::A chave do secret RELEASE_SIGNING_KEY não é nenhuma das chaves públicas de ReleaseSignature.cs."
            rm -f "$RUNNER_TEMP/key.pem"
            exit 1
          fi
          openssl dgst -sha256 -sign "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/sig.bin" "$RUNNER_TEMP/message.txt"
          openssl ec -in "$RUNNER_TEMP/key.pem" -pubout -out "$RUNNER_TEMP/pub.pem"
          rm -f "$RUNNER_TEMP/key.pem"
          openssl dgst -sha256 -verify "$RUNNER_TEMP/pub.pem" -signature "$RUNNER_TEMP/sig.bin" "$RUNNER_TEMP/message.txt"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > "$msi.sig"
        env:
          SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

      # Envia o MSI para o VirusTotal analisar, para o link das notas já abrir o relatório. Sem a chave
      # (secret VIRUSTOTAL_API_KEY, da conta gratuita) ou com o VirusTotal fora do ar, a release segue sem o envio.
      - name: Enviar ao VirusTotal
        continue-on-error: true
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::notice::Sem o secret VIRUSTOTAL_API_KEY: o instalador não foi enviado ao VirusTotal."
            exit 0
          fi
          # Acima de 32 MB a API exige pedir antes uma URL de envio.
          upload_url=$(curl -fsS -H "x-apikey: $VT_API_KEY" https://www.virustotal.com/api/v3/files/upload_url | jq -r .data)
          curl -fsS -H "x-apikey: $VT_API_KEY" -F "file=@$(ls dist/*.msi)" "$upload_url" > /dev/null
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

      - name: Criar a GitHub Release
        run: gh release create "$GITHUB_REF_NAME" dist/*.msi dist/*.msi.sig --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # As notas são lidas com o token do job: o PUBLIC_RELEASES_TOKEN só enxerga o repo público.
      # Ganham no fim o SHA-256 do instalador e o link da análise no VirusTotal (o release-status.ps1 mexe só no começo).
      - name: Ler as notas da release
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          msi=$(ls dist/*.msi)
          sha=$(sha256sum "$msi" | cut -d' ' -f1)
          cat >> notes.md <<EOF

          ## Verificar o instalador

          SHA-256 de \`$(basename "$msi")\`: \`$sha\`

          Análise no VirusTotal: https://www.virustotal.com/gui/file/$sha
          EOF
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # O repo do app é privado: o download público (e a landing page) vem do repo miguelsoeth/screencord.
      # É a release "latest" de lá que o app instalado baixa na atualização automática.
      - name: Publicar no repo público de downloads
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.msi dist/*.msi.sig --repo miguelsoeth/screencord --title "$GITHUB_REF_NAME" --notes-file notes.md --latest
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
